<!DOCTYPE html>
<html>
<head>
    <title>CSS Text Styles and Layouts</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 50px 8%;
            font-family: Arial, sans-serif;
            background-color: white;
        }

        h1 {
            font-size: 42px;
            margin: 0 0 15px 0;
            color: #222;
        }

        hr {
            border: none;
            border-top: 2px solid #ddd;
            margin-bottom: 35px;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #333;
        }

        .intro {
            font-size: 19px;
            color: #444;
            margin-bottom: 35px;
        }

        .container {
            display: flex;
            gap: 30px;
            width: 100%;
        }

        .box {
            flex: 1;
            min-height: 250px;
            border: 2px solid #ccc;
            border-radius: 5px;
            padding: 25px;
        }

        .box h3 {
            font-size: 25px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .sidebar p {
            font-size: 18px;
            font-style: italic;
            line-height: 1.7;
        }

        .main p {
            font-size: 18px;
            text-transform: uppercase;
            line-height: 1.7;
        }
    </style>
</head>

<body>

    <h1>CSS Text Styles and Layouts</h1>

    <hr>

    <h2>Simple Web Layout Using CSS</h2>

    <p class="intro">
        This is a simple example of a web layout using various CSS text styles.
    </p>

    <div class="container">

        <div class="box sidebar">
            <h3>Sidebar</h3>

            <p>
                Lorem ipsum dolor sit amet, consectetur adipiscing elit.
            </p>
        </div>

        <div class="box main">
            <h3>Main Content</h3>

            <p>
                Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
            </p>
        </div>

    </div>

</body>
</html>
